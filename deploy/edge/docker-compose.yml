# Polje Edge — Mosquitto + Edge + go2rtc + optional Frigate
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  go2rtc:
    image: alexxit/go2rtc:latest
    ports:
      - "1984:1984"
    volumes:
      - ../nvr/go2rtc.yaml:/config/go2rtc.yaml:ro
    restart: unless-stopped

  edge:
    build: ../../apps/edge
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      POLJE_API: ${POLJE_API:-https://opg-ivanjovic.hr}
      INGEST_TOKEN: ${INGEST_TOKEN}
      FARM_ID: ivan-jovic
      FLUSH_MS: "5000"
      SNAPSHOT_INTERVAL_SEC: ${SNAPSHOT_INTERVAL_SEC:-600}
      GO2RTC_URL: http://go2rtc:1984
      CAMERA_YARD_RTSP: ${CAMERA_YARD_RTSP:-}
      CAMERA_GARDEN_RTSP: ${CAMERA_GARDEN_RTSP:-}
      CAMERA_HAY_RTSP: ${CAMERA_HAY_RTSP:-}
    volumes:
      - edge-data:/var/lib/polje
    depends_on:
      - mosquitto
      - go2rtc
    restart: unless-stopped
    ports:
      - "8788:8788"

  sim:
    build: ../../apps/edge
    command: ["node", "src/sim.js"]
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      FARM_ID: ivan-jovic
      SIM_INTERVAL_MS: "10000"
    depends_on:
      - mosquitto
    restart: unless-stopped
    profiles: ["sim"]

  nvr:
    image: ghcr.io/blakeblackshear/frigate:stable
    volumes:
      - ../nvr/frigate.yml:/config/config.yml:ro
      - frigate-media:/media/frigate
    restart: unless-stopped
    profiles: ["cameras"]

volumes:
  mosquitto-data:
  edge-data:
  frigate-media:
